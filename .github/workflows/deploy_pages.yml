name: Build Zola and Deploy to GitHub Pages

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codeberg source
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          : "${CODEBERG_TOKEN:?CODEBERG_TOKEN secret is required}"
          git clone "https://SuzhaharCan:${CODEBERG_TOKEN}@codeberg.org/SuzhaharCan/SuzhaharCan.codeberg.page.git" zola_source
          test -f zola_source/zola.toml
          test -f zola_source/scripts/sync-theme.mjs
          test -f zola_source/build-site.sh

      - name: Install Zola v0.23.6
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz \
            -o zola.tar.gz
          tar -xzf zola.tar.gz
          chmod +x zola
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Init configured theme submodules and build
        run: |
          set -euo pipefail
          cd zola_source

          THEME="$(node scripts/sync-theme.mjs --print-theme)"
          test -n "$THEME"
          echo "Configured theme: $THEME"

          git submodule sync --recursive -- "themes/$THEME"
          git submodule update --init --recursive -- "themes/$THEME"
          test -f "themes/$THEME/theme.toml"
          git submodule status --recursive "themes/$THEME"

          chmod +x build-site.sh
          ./build-site.sh --output-dir ../public_html

      - name: Verify deployment output
        run: |
          set -euo pipefail
          test -f public_html/index.html
          test -f public_html/style.css
          echo "Deployment output verified."

      - name: Deploy pure HTML to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd public_html
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi
          git commit -m "Deploy generated site from Codeberg source"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages --force
